# Grain maize on the EU_val inputs. Run every command with CM4EU_CROP=maize:
# the crop profile (src/cropmodelling4eu/crops.py) fixes the CLMS label, the
# offsets, the moisture basis and the parameter specs at import, and
# season.crop below must name the same profile or the config is refused.
#
# EU_val_maize symlinks weather/, soil/ and validation/ to EU_val; only site/
# (SAGE Maize calendar) and management/ (NPKGRIDS maize, maize vIRR) are its own.
run_name: maize_2000_2024_euval
paths:
  export_dir: "/data01/FDS/muduchuru/Data/SIMPLACE/cropmodelling4eu_inputs/exports/mswx/EU_val_maize"
  output_dir: "/data01/FDS/muduchuru/Data/SIMPLACE/cropmodelling4eu"
  composition_file: "/beegfs/muduchuru/simplace/Brandenburg_1KM_winter_wheat/data/management/fertilizer_composition.xml"
  # Cells where maize is >= 5 % of the cell's cropland (MIRCA-OS/ECIRA area).
  cells_file: "/data01/FDS/muduchuru/Data/SIMPLACE/cropmodelling4eu_inputs/exports/mswx/EU_val_maize/domain_maize_5pct.csv"
grid:
  resolution_deg: 0.1
  min_lon: -17.0
  max_lon: 52.0
  min_lat: 34.0
  max_lat: 72.0
season:
  start_year: 2000
  end_year: 2024
  crop: maize
torchcrop:
  iopt: 3
  batch_size: 2048
  io_workers: 16
  torch_threads: 4
  device: cpu
  rootzone_m: 1.0
  profile_bottom_m: 2.0
  spinup_months: 0
  # A spring crop sown in April-June matures within the calendar year; 365 is
  # the winter-wheat value and would simulate half a year of bare soil.
  min_days_after_sowing: 240   # also the maize profile default
simplace:
  template_dir: "/data01/FDS/muduchuru/Data/SIMPLACE/TEMPLATES/Rotation_monocrop"
  solution_file: "/data01/FDS/muduchuru/codes/GITHUB/data4simplace/cropmodelling4eu/templates/sustag/solution/EU_SUSTAg_data4simplace.sol.xml"
  project_file: "/data01/FDS/muduchuru/codes/GITHUB/data4simplace/cropmodelling4eu/templates/sustag/project/EU_SUSTAg_data4simplace.proj.xml"
  singularity_image: "/beegfs/common/singularity/simplace/simplace_5.0-3897.sif"
  # glibc Temurin runtime: the stock (musl) image crashes JVMs that share a node
  # (2026-11-06); same pair as config_production.yaml.
  java_image: "/data01/FDS/muduchuru/Data/SIMPLACE/containers/temurin-17-jre-jammy.sif"
  simplace_dir: "/data01/FDS/muduchuru/Data/SIMPLACE/containers/simplace_5.0-3897"
  start_date: "1979-01-01"
  end_date: "2024-12-31"
  iopt: 3
  weather_contract: null
  weather_conversion: transform
  io_workers: 32
  lines_per_task: 500
  # MAIZ selects the SUSTAg crop block; rule mode 1 is the warm-soil rule (the
  # winter-cereal "Tmin7 <= 12 C" holds on every April day).
  solution_variables:
    vCrop: MAIZ
    vSowRuleMode: 1
    vSowTmean7Min: 10.0
    vSowMoistMaxFracAW: 0.9
