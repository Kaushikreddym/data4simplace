# =============================================================================
# Stage 2 — yield, grain maize (SUSTAg `MAIZ` block). Same groups as the wheat
# spec, keyed on the MAIZ tables' own breakpoints: a `table@x` names an
# existing knot, and the WW knots (0.646, 0.95, 0.99, 1.3) do not exist here.
#
#   FLTB  0 .62 | 0.33 .62 | 0.88 .15 | 0.95 0   | 2 0
#   FSTB  0 .38 | 0.33 .38 | 0.88 .85 | 0.95 1   | 1.0 1 | 1.2 0 | 2 0
#   FOTB  0 0   | 0.95 0   | 1.0 0    | 1.2 1    | 2 1
#   RUETB 0 3.5 | 1.0 3.4  | 1.5 2.4  | 2.0 1.6        (C4: well above WW's 2.6)
#
# Irrigated cells are kept out of the pool (data.exclude_irrigated in the maize
# calibration config) until the torchcrop irrigation path is checked against
# SIMPLACE's.
# =============================================================================

parameters:
  # --- Partitioning ---------------------------------------------------------
  crop.fltb@0.33: {bounds: [0.3, 0.8]}
  crop.fltb@0.88: {bounds: [0, 0.5]}
  crop.fstb@0.33: {bounds: [0.2, 0.7]}
  crop.fstb@0.88: {bounds: [0.4, 1]}
  crop.fotb@1.0:  {bounds: [0, 0.5]}
  crop.fotb@1.2:  {bounds: [0.6, 1]}

  # --- Assimilation ---------------------------------------------------------
  crop.ruetb@0.0:  {bounds: [2.5, 4.5]}
  crop.ruetb@1.0:  {bounds: [2.5, 4.5]}
  crop.ruetb@1.5:  {bounds: [1.0, 3.5]}
  crop.scale_factor_rue: {bounds: [0.8, 1.25]}

  # --- Water ----------------------------------------------------------------
  crop.depnr: {bounds: [2.0, 5.0]}
  crop.cfet:  {bounds: [0.8, 1.2]}
  crop.rdmcr: {bounds: [0.8, 2.0]}
  # MAIZ 0.03 sits on the wheat spec's upper bound, so the range is shifted.
  crop.rri:   {bounds: [0.01, 0.04]}

  # --- Nitrogen --- BLOCKED, same reason as wheat ---------------------------
  crop.nmaxso: {bounds: [0.01, 0.03],  blocked: "initial mineral N: nni = 0.985"}
  crop.frnx:   {bounds: [0.3, 1.0],    blocked: "initial mineral N: nni = 0.985"}
  crop.nlue:   {bounds: [0.8, 1.5],    blocked: "initial mineral N: nni = 0.985"}
  crop.tcnt:   {bounds: [5, 20],       blocked: "initial mineral N: nni = 0.985"}
  crop.dvsnt:  {bounds: [0.6, 1.0],    blocked: "initial mineral N: nni = 0.985"}
  crop.nrf:    {bounds: [0.4, 0.9],    blocked: "management parameter in SIMPLACE"}

  # --- Heat around anthesis --- BLOCKED, same reason as wheat ---------------
  crop.grain_heat_temp_critical:  {bounds: [28, 38], blocked: "heat group unmapped"}
  crop.grain_heat_temp_limit:     {bounds: [36, 48], blocked: "heat group unmapped"}
  crop.grain_heat_begin_devstage: {bounds: [0.7, 1.1], blocked: "heat group unmapped"}
  crop.grain_heat_end_devstage:   {bounds: [1.2, 1.6], blocked: "heat group unmapped"}

constraints:
  - members: [crop.ruetb@0.0, crop.ruetb@1.0, crop.ruetb@1.5]
    order: descending
  - members: [crop.fotb@1.0, crop.fotb@1.2]
    order: ascending

simplex:
  # At both knots MAIZ fl + fs = 1 and fo = 0, so the pair must stay <= 1.
  - members: [crop.fltb@0.33, crop.fstb@0.33]
  - members: [crop.fltb@0.88, crop.fstb@0.88]

priors:
  # The SUSTAg MAIZ values, which are where both models start.
  crop.ruetb@0.0: {value: 3.5, spread: 0.5}
  crop.ruetb@1.0: {value: 3.4, spread: 0.5}
  crop.ruetb@1.5: {value: 2.4, spread: 0.6}
  crop.scale_factor_rue: {value: 1.0, spread: 0.15}
  crop.depnr: {value: 4.0, spread: 1.0}
  crop.rdmcr: {value: 1.2, spread: 0.3}
