# =============================================================================
# SIMPLACE calibration (Optuna) — the parameters SIMPLACE actually reads.
#
# Same names, bounds and priors as torchcrop's params_phenology.yaml /
# params_yield.yaml, so a SIMPLACE fit and a torchcrop fit are of the same
# parameters against the same objective. Two departures, both forced:
#
# * Only parameters the SIMPLACE solution reads from crop.xml. `depnr`, `cfet`
#   and `rdmcr` are read by no SIMPLACE component (byte-identical output in the
#   2026-11-05 stress pilot), so a TPE search over them would be a search over
#   noise. `scale_factor_rue` has no SIMPLACE field; `write_simplace_crop_xml`
#   folds it into every RUETB ordinate, which is exactly torchcrop's
#   `scale_factor_rue * RUETB(DVS)`.
# * Ordering constraints become bounds. Optuna samples a box, and every
#   constraint below has one member fixed by the stage, so it is a bound:
#   `vbase <= versat` with vbase fixed at the crop file's 14 makes versat's
#   lower bound 15 (at versat == vbase SIMPLACE divides by zero), and
#   `fotb@0.99 <= fotb@1.0` with fotb@1.0 fixed at 1.0 is the [0, 1] bound.
#
# Yield is reduced to three parameters. Ranked by |dL/dz| at the starting crop
# (calibration/yield_gradient_check.csv, euval) among the SIMPLACE-live ones:
#   ruetb@1.3 1.22, scale_factor_rue 1.16, ruetb@0.0 0.73, fotb@0.99 0.66,
#   fltb@0.646 0.52, ruetb@1.0 0.13, fotb@1.0 0.10
# ruetb@0.0 and ruetb@1.0 are near-duplicates of scale_factor_rue (r 0.98 in
# yield_identifiability.csv), so they are dropped in its favour, leaving one
# parameter each for assimilation level, grain-fill RUE and grain partitioning.
# The three also carry the widest spread across the 27 torchcrop-calibrated
# regions after fotb@1.0 (std of the fitted value, as a fraction of its range:
# fotb@0.99 0.15, ruetb@1.3 0.14, scale_factor_rue 0.12).
#
# Phenology keeps torchcrop's tier 1 (the parameters every region frees).
# Tier 2 (vernrt/phottb knots, vbase, dtsmtb, tbasem) was freed in only 11 of
# 27 regions and is 14 more dimensions than a TPE search over ~40 SIMPLACE
# runs can resolve.
# =============================================================================

stages:
  phenology:
    parameters:
      crop.tsumem: {bounds: [100, 200], init: 150}
      crop.tsum1:  {bounds: [500, 1300]}
      crop.tsum2:  {bounds: [400, 1350]}
      crop.versat: {bounds: [15, 70]}
    priors:
      crop.tsum1:  {value: 860, spread: 200}
      crop.tsum2:  {value: 794, spread: 240}
      crop.versat: {value: 54,  spread: 16}
      crop.tsumem: {value: 150, spread: 50}
    ratio_priors:
      - numerator: crop.tsum1
        denominator: crop.tsum2
        value: 0.52
        spread: 0.06

  yield:
    parameters:
      crop.scale_factor_rue: {bounds: [0.8, 1.25]}
      crop.ruetb@1.3:        {bounds: [0.5, 3.0]}
      crop.fotb@0.99:        {bounds: [0, 1]}
    priors:
      crop.scale_factor_rue: {value: 1.0, spread: 0.15}
      crop.ruetb@1.3:        {value: 2.0, spread: 0.5}
